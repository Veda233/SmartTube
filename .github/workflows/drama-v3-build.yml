name: Drama V3 build baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build debug APK (no release signing secrets)
        run: |
          chmod +x gradlew
          ./gradlew :smarttubetv:assembleStbetaDebug --stacktrace --no-daemon
      - name: Inspect APK minSdkVersion
        if: success()
        shell: bash
        run: |
          echo "APK output files:"
          find smarttubetv/build/outputs/apk -name '*.apk' -print
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          find smarttubetv/build/outputs/apk -name '*.apk' -print0 | while IFS= read -r -d '' apk; do
            echo "Checking $apk"
            "$BUILD_TOOLS/aapt" dump badging "$apk" | grep -E '^(package:|sdkVersion:|native-code:)'
            sdk=$("$BUILD_TOOLS/aapt" dump badging "$apk" | sed -n "s/^sdkVersion:'\\([0-9]*\\)'.*/\\1/p" | head -1)
            [ -n "$sdk" ] && [ "$sdk" -le 18 ] || { echo "Expected minSdkVersion <= 18, got $sdk"; exit 1; }
          done
      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drama-v3-build-output
          path: |
            smarttubetv/build/outputs/apk/**/*.apk
            smarttubetv/build/reports/**
          if-no-files-found: warn
